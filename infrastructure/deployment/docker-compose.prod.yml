# Production deployment from published images (see docs/operations/deployment.md).
#
#   cp infrastructure/deployment/.env.production.example .env.production   # fill it in
#   infrastructure/deployment/preflight.sh .env.production
#   docker compose -f infrastructure/deployment/docker-compose.prod.yml --env-file .env.production \
#     --profile monitoring up -d
#   infrastructure/deployment/verify.sh https://$CHAINSIGHT_DOMAIN
#
# Only Caddy publishes public ports (80/443); the monitoring profile binds to loopback. The
# database, Redis, API and web app are reachable on the internal network only, and the API
# refuses to start with unsafe production settings.
name: chainsight-prod

x-image: &api-image ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/chainsight-api:${CHAINSIGHT_VERSION:?set CHAINSIGHT_VERSION}

x-backend: &backend
  image: *api-image
  env_file: [{ path: ../../.env.production, required: false }]
  environment: &backend-env
    APP_ENV: production
    LOG_FORMAT: json
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chainsight}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-chainsight}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    API_CORS_ORIGINS: https://${CHAINSIGHT_DOMAIN:?set CHAINSIGHT_DOMAIN}
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    AUTH_COOKIE_SECURE: "true"
    TRUSTED_PROXY_COUNT: "1"
    MODEL_ARTIFACT_DIR: /app/data/models
    MLFLOW_TRACKING_URI: sqlite:////app/data/mlflow.db
  volumes: [mldata:/app/data]
  networks: [internal]
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chainsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chainsight}
    volumes: [pgdata:/home/postgres/pgdata]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chainsight} -d ${POSTGRES_DB:-chainsight}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]
    shm_size: 512m
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m services.ingestion.port_registry --if-empty"]
    restart: "no"
    depends_on: { db: { condition: service_healthy } }

  api:
    <<: *backend
    # Several workers share metrics through PROMETHEUS_MULTIPROC_DIR, wiped at each start.
    command: ["sh", "-c", "rm -rf /tmp/prometheus && mkdir -p /tmp/prometheus && exec uvicorn chainsight_api.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2} --no-server-header"]
    environment:
      <<: *backend-env
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *backend
    command: ["celery", "-A", "services.worker.app", "worker", "-l", "INFO", "-Q", "default,ingest,ml",
              "--concurrency", "${WORKER_CONCURRENCY:-2}"]
    environment:
      <<: *backend-env
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  beat:
    <<: *backend
    command: ["celery", "-A", "services.worker.app", "beat", "-l", "INFO", "-s", "/tmp/celerybeat-schedule"]
    healthcheck: { disable: true }
    depends_on: { redis: { condition: service_healthy } }

  ais-consumer:
    <<: *backend
    command: ["python", "-m", "services.ingestion.ais_consumer"]
    restart: on-failure
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    image: ghcr.io/${GHCR_OWNER}/chainsight-web:${CHAINSIGHT_VERSION}
    networks: [internal]
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.8-alpine
    environment:
      CHAINSIGHT_DOMAIN: ${CHAINSIGHT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [internal]
    depends_on: [web, api]
    restart: unless-stopped
    logging: *logging

  backup:
    image: timescale/timescaledb-ha:pg16
    entrypoint: ["/scripts/run-scheduled.sh"]
    user: root
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-chainsight}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-chainsight}
      BACKUP_DIR: /backups
      BACKUP_AT: ${BACKUP_AT:-02:30}
    volumes:
      - ../backup:/scripts:ro
      - ${BACKUP_HOST_DIR:-/var/backups/chainsight}:/backups
    networks: [internal]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
    logging: *logging

  # --- monitoring (opt-in): add `--profile monitoring` -------------------------------------
  # Bound to the host's loopback only; reach them over an SSH tunnel:
  #   ssh -L 3001:127.0.0.1:3001 -L 9090:127.0.0.1:9090 -L 9093:127.0.0.1:9093 <host>
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    entrypoint: ["/etc/prometheus/entrypoint.sh"]
    command: ["--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"]
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - ../monitoring/prometheus-entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [internal]
    restart: unless-stopped
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.28.0
    profiles: ["monitoring"]
    entrypoint: ["/etc/alertmanager/entrypoint.sh"]
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_SMTP_SMARTHOST: ${ALERT_SMTP_SMARTHOST:-}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-}
      ALERT_SMTP_USERNAME: ${ALERT_SMTP_USERNAME:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
    volumes:
      - ../monitoring/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - amdata:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    networks: [internal]
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    networks: [internal]
    depends_on: [prometheus]
    restart: unless-stopped
    logging: *logging

networks:
  internal:

volumes:
  pgdata:
  redisdata:
  mldata:
  caddydata:
  caddyconfig:
  promdata:
  amdata:
  grafanadata:
