# Scrapes the ChainSight processes on the compose network. Start with:
#   docker compose --profile monitoring up -d
# prometheus-entrypoint.sh adds the API bearer token when METRICS_TOKEN is set.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: worker
    static_configs: [{ targets: ["worker:9808"] }]
  - job_name: ais-consumer
    static_configs: [{ targets: ["ais-consumer:9809"] }]
  - job_name: alertmanager
    static_configs: [{ targets: ["alertmanager:9093"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
