# ChainSight local stack.  Usage:  cp .env.example .env && docker compose up --build
name: chainsight

x-backend: &backend
  build:
    context: .
    dockerfile: infrastructure/docker/api.Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chainsight}:${POSTGRES_PASSWORD:-chainsight}@db:5432/${POSTGRES_DB:-chainsight}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    # Local default: the synthetic simulator (labeled as such everywhere). Set
    # AIS_PROVIDER=aisstream and AISSTREAM_API_KEY in .env for live AIS.
    AIS_PROVIDER: ${AIS_PROVIDER:-simulator}
    # Model artifacts and the MLflow tracking DB live on a shared volume, so a model trained
    # by the worker (or `docker compose run worker python -m services.ml_jobs ...`) is
    # loadable by every backend container. Artifact URIs are stored relative to this dir.
    MODEL_ARTIFACT_DIR: /app/data/models
    MLFLOW_TRACKING_URI: sqlite:////app/data/mlflow.db
  volumes:
    - mldata:/app/data
  restart: unless-stopped

services:
  db:
    # TimescaleDB HA image bundles PostGIS and preloads timescaledb.
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chainsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chainsight}
      POSTGRES_DB: ${POSTGRES_DB:-chainsight}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chainsight} -d ${POSTGRES_DB:-chainsight}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    # Seeds the UN/LOCODE port registry on first start (skipped if present or offline).
    command: ["sh", "-c", "alembic upgrade head && python -m services.ingestion.port_registry --if-empty"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["celery", "-A", "services.worker.app", "worker", "-l", "INFO", "-Q", "default,ingest,ml"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ais-consumer:
    <<: *backend
    command: ["python", "-m", "services.ingestion.ais_consumer"]
    restart: on-failure  # AIS_PROVIDER=disabled exits cleanly and stays stopped
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *backend
    command: ["celery", "-A", "services.worker.app", "beat", "-l", "INFO", "-s", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  mldata:
