name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: chainsight
          POSTGRES_PASSWORD: chainsight
          POSTGRES_DB: chainsight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chainsight" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://chainsight:chainsight@localhost:5432/chainsight
      TEST_DATABASE_URL: postgresql+psycopg://chainsight:chainsight@localhost:5432/chainsight_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy core database integrations apps/api/chainsight_api services
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
      - name: Tests
        run: uv run pytest -ra

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
