name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: shellcheck --severity=warning infrastructure/*/*.sh infrastructure/monitoring/alertmanager/*.sh
      - name: Compose files
        run: |
          docker compose config -q
          printf 'GHCR_OWNER=o\nCHAINSIGHT_VERSION=1\nPOSTGRES_PASSWORD=p\nCHAINSIGHT_DOMAIN=d\nJWT_SECRET=j\nACME_EMAIL=a\n' > /tmp/prod.env
          docker compose -f infrastructure/deployment/docker-compose.prod.yml --env-file /tmp/prod.env --profile monitoring config -q
      - name: Prometheus rules and config
        run: |
          docker run --rm -v "$PWD/infrastructure/monitoring:/m:ro" --entrypoint promtool prom/prometheus:v3.1.0 check rules /m/alerts.yml
          sed 's|/etc/prometheus/alerts.yml|/m/alerts.yml|' infrastructure/monitoring/prometheus.yml > /tmp/prometheus.yml
          docker run --rm -v "$PWD/infrastructure/monitoring:/m:ro" -v /tmp/prometheus.yml:/p.yml:ro --entrypoint promtool prom/prometheus:v3.1.0 check config /p.yml
      - name: Alertmanager config (all receivers)
        env:
          ALERT_WEBHOOK_URL: https://hooks.example.invalid/x?a="1"
          ALERT_SLACK_WEBHOOK_URL: https://hooks.slack.example.invalid/T/B/X
          ALERT_EMAIL_TO: ops@example.invalid
          ALERT_SMTP_SMARTHOST: smtp.example.invalid:587
          ALERT_SMTP_FROM: am@example.invalid
          ALERT_SMTP_USERNAME: u
          ALERT_SMTP_PASSWORD: p\w"x
        run: |
          sh infrastructure/monitoring/alertmanager/entrypoint.sh render > /tmp/am.yml
          docker run --rm -v /tmp/am.yml:/c.yml:ro --entrypoint amtool prom/alertmanager:v0.28.0 check-config /c.yml

  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: chainsight
          POSTGRES_PASSWORD: chainsight
          POSTGRES_DB: chainsight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chainsight" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://chainsight:chainsight@localhost:5432/chainsight
      TEST_DATABASE_URL: postgresql+psycopg://chainsight:chainsight@localhost:5432/chainsight_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy core database integrations ml apps/api/chainsight_api services
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
      - name: Tests
        run: uv run pytest -ra

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    env:
      E2E_EMAIL: e2e-owner@chainsight.test
      E2E_PASSWORD: ci-only e2e passphrase
    steps:
      - uses: actions/checkout@v4
      - name: Configure the stack
        run: |
          cat > .env <<ENV
          AIS_PROVIDER=simulator
          JWT_SECRET=$(openssl rand -base64 48)
          BOOTSTRAP_ADMIN_EMAIL=${E2E_EMAIL}
          BOOTSTRAP_ADMIN_PASSWORD=${E2E_PASSWORD}
          ENV
      - name: Start the stack
        run: docker compose up --build -d db redis api web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Wait for the API and web app
        run: |
          for i in $(seq 1 150); do
            curl -fsS http://localhost:8000/api/v1/health/ready >/dev/null && curl -fsS http://localhost:3000/login >/dev/null && exit 0
            sleep 2
          done
          docker compose ps; exit 1
      - name: Smoke tests
        working-directory: apps/web
        run: npm run e2e
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail=200 api web migrate
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
